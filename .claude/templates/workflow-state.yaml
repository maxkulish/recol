# Workflow State File Template
# Location: docs/status/rec-XX-workflow.yaml
# Purpose: Persist workflow state between sessions for task orchestration
#
# This file is created and managed by /task:orchestrate
# Do not edit manually unless debugging workflow issues

# Task identification
task_id: REC-XX
linear_url: https://linear.app/cloud-ai/issue/REC-XX
title: "[Task title from Linear]"
branch: feat/rec-XX-short-desc
task_type: development  # development | specification | operational
created: "2024-01-01T00:00:00Z"

# Current workflow state
workflow:
  # Possible phases: design | spec | plan | implement | pr | complete
  current_phase: design

  # Possible statuses:
  #   awaiting_input - waiting for user action/input
  #   in_progress - actively executing
  #   checkpoint - paused for user validation
  #   complete - phase or workflow finished
  #   blocked - cannot proceed due to error/blocker
  status: awaiting_input

# Individual phase states
phases:
  design:
    # Status: pending | in_progress | checkpoint | complete | skipped
    status: pending
    # Path to design document when created
    design_doc: null
    # Whether draft is ready for review
    draft_ready: false
    # Whether design is finalized and approved
    finalized: false
    # Discovery probe tracking
    probe_completed: false
    probe_decision: null  # design | ops | pivot | skip
    # AI review tracking
    review_backend: null    # lok | native | none - which backend actually ran
    review_reports: []      # Paths to the individual reviews
    review_verdict: null    # APPROVE | APPROVE_WITH_SUGGESTIONS | NEEDS_REVISION (strictest of all)
    review_completed: false # Whether AI review ran successfully
    # Review feedback application tracking
    review_applied: false
    applied_suggestions: []  # List of suggestions that were auto-applied
    flagged_suggestions: []  # List of contradicting items with user resolution

  spec:
    # Only used for specification task type
    status: pending
    spec_file: null
    approved: false
    main_sha_at_approval: null
    # AI review tracking
    review_backend: null    # lok | native | none - which backend actually ran
    review_reports: []      # Paths to the individual reviews
    review_synthesis: null  # Path to the synthesis
    review_verdict: null    # APPROVE | APPROVE_WITH_SUGGESTIONS | NEEDS_REVISION (strictest)
    review_completed: false
    review_applied: false
    applied_suggestions: []
    flagged_suggestions: []

  plan:
    status: pending
    # Path to plan file when created
    plan_file: null
    # Whether plan has been approved for implementation
    approved: false
    # main SHA at approval time; Checkpoint B compares against it for drift
    main_sha_at_approval: null

  implement:
    status: pending
    # Current step number (1-indexed)
    current_step: 0
    # Total steps in plan
    total_steps: 0
    # List of commit SHAs created during implementation
    commits: []
    # Name of last completed implementation phase
    last_phase_completed: null
    # Validation gate: the verdicts live in the top-level `gate:` block. These
    # are only the artifacts a run produced.
    gate_run: false
    validation_reports: []    # Paths to reviewer and synthesis reports, if L4 ran
    # Defects found mid-task that belong to another task (conventions W1).
    # [{path, reason, owner_task}] - flag and defer, do not widen the diff.
    deliberately_not_changed: []

  pr:
    status: pending
    # GitHub PR URL
    pr_url: null
    # GitHub PR number
    pr_number: null
    # Count of review rounds addressed
    reviews_addressed: 0
    # Whether PR has final approval
    approved: false
    # Pre-flight CI check tracking
    ci_passed: false

  complete:
    status: pending
    # Whether PROJECT.md, ROADMAP.md, DEPENDENCIES.md updated
    aggregation_files_updated: false
    # Timestamp when PR was merged
    merged_at: null

# Advisor consult config (command-level Advisor-tool pattern; see
# docs/specs/2026-07-02-orchestrator-advisor-outcome-design.md)
advisor:
  enabled: true
  model: null                    # null = use the session model (the floor). Set to upgrade, e.g. claude-fable-5.
  effort: high                   # high | max
  max_calls_per_checkpoint: 1    # A and B: 1 each. C is bounded by outcome.max_iterations, not this cap.
  calls: []                      # single source of truth: [{phase, checkpoint, verdict, reasons, ts}]

# The referee for the implement phase (docs/plan/30-command-suite-adaptation.md).
# Four layers, cheapest and most certain first. `runner` owns L2 and L3; the
# phase file owns L1 and L4.
gate:
  runner: scripts/gate.sh
  # Which reviewer backend L4 reached:
  #   lok    - .lok/workflows/implement-gate.toml was present and ran
  #   native - Agent-tool reviewer fan-out
  #   none   - no reviewer was reachable; L1-L3 still bind
  llm_layer: null
  # Verdicts copied from the runner's GATE SUMMARY block, plus L4.
  # PASS | FAIL | MANUAL | DEFERRED | UNAVAILABLE
  layers: []                     # [{layer, verdict, note}]
  # Combined verdict over L1-L3 only: PASS | FAIL | INCOMPLETE
  deterministic_verdict: null
  # A gate that has never failed proves nothing. Set once per repo, not per task.
  negative_validation:
    validated: false
    record: null                 # Path to the entry recording the seeded failure

# Bounded grade-and-retry loop wrapping the Step 5 validation gate
outcome:
  max_iterations: 3              # cap 5; 0 disables the loop (Step 5 behaves as today)
  iteration: 0
  status: pending                # pending | satisfied | exhausted | waived | ungraded

# Audit trail of all workflow actions
history:
  - timestamp: "2024-01-01T00:00:00Z"
    action: workflow_started
    phase: design
    details: "Workflow initialized for REC-XX"

# History action types:
#   workflow_started          - Initial workflow creation
#   workflow_resumed          - Resumed from previous session
#   workflow_paused           - User paused workflow
#   workflow_complete         - Full workflow finished
#   workflow_blocked          - Task blocked by another task
#   workflow_unblocked        - Blocker resolved, task unblocked
#   project_sync_start        - Task added to Active Work
#   project_sync_complete     - Task moved to Recently Completed
#   discovery_probe_complete  - Multi-model discovery probe finished
#   design_started            - Design doc creation began
#   design_draft_ready        - Design doc draft completed
#   design_review_started     - AI review (Gemini + Ollama) launched
#   design_review_complete    - Both reviews completed with verdicts
#   design_review_timeout     - One or both reviews timed out
#   design_review_failed      - One or both reviews encountered an error
#   review_applied            - Non-contradicting suggestions auto-applied
#   review_conflicts_resolved - User resolved contradicting suggestions
#   design_finalized          - Design doc approved and finalized
#   spec_approved             - Specification approved for implementation
#   plan_created              - Implementation plan generated
#   plan_approved             - Plan approved for implementation
#   phase_completed           - Implementation phase finished
#   implementation_complete   - All plan tasks done
#   gate_run                  - Validation gate executed (details: tier, verdict)
#   gate_incomplete           - A gate layer could not run; verdict is not a pass
#   commit_created            - Git commit made
#   pushed_to_remote          - Branch pushed to origin
#   pre_flight_checks_passed  - All local CI checks passed
#   pre_flight_fix_applied    - Fixed issue caught by pre-flight checks
#   pr_created                - Pull request created
#   ci_passed                 - All CI jobs passed after PR push
#   ci_fix_applied            - Fixed CI failure, pushed fix
#   review_addressed          - PR review feedback addressed
#   pr_approved               - PR approved for merge
#   pr_merged                 - PR merged to main
#   advisor_consult           - Advisor consult ran at a checkpoint (details: phase, checkpoint, verdict)
#   advisor_skipped           - Trigger-scoped consult (B) did not fire (details: reason)
#   advisor_failed            - Advisor consult timed out or errored; workflow proceeded
#   outcome_iteration         - One grade-and-retry pass completed
#   outcome_satisfied         - Outcome loop passed the gate (loop exit)
#   outcome_exhausted         - Outcome loop hit max_iterations and escalated to human
#   outcome_ungraded          - A required grader was unavailable; escalated to human
#   waiver                    - Human waived the whole gate with a recorded reason
#   override                  - Human proceeded past a FAIL at the Step 5 menu
