# Qodo code review configuration.
#
# Reference: https://docs.qodo.ai/install-and-configure/configuration-overview/configuration-and-command-reference
#
# This file only takes effect from the root of the default branch, and only for
# PRs opened after it lands there. Portal settings (Configurations > Code review)
# cover the same keys; repository config wins over org-level defaults.
#
# Qodo also imports AGENTS.md and CLAUDE.md from this repo as review rules, so
# the Core Rules in AGENTS.md are already enforced without restating them here.
# The guidelines below only add what those files do not state as a rule.

[github_app]
# `/agentic_describe` is deliberately absent: `/pr:create` writes a structured
# PR body and Qodo would compete with it. Enable it only with
# `[qodo_describe_agent] publish_mode = "comment"` set below.
pr_commands = [
    "/agentic_review",
]

# Re-review on every push. This is what closes the `/pr:review` loop: push a fix
# and Qodo re-validates it without a trigger comment, then strikes through the
# findings the push resolved.
handle_push_trigger = true
push_commands = [
    "/agentic_review",
]

[review_agent]
# Findings appear both in the persistent summary comment and as inline comments,
# so each reviewable finding has a thread to reply into.
comments_location_policy = "both"

# 3 = Action Required only, 2 = also Review Recommended, 1 = also Informational.
# The threshold applies to inline comments only; the summary always lists every
# finding regardless of severity.
inline_comments_severity_threshold = 2

# Qodo must not gate the merge on an author self-review acknowledgement, and must
# not approve on its own. Approval stays a human decision.
demand_self_review = false
approve_pr_on_self_review = false

issues_user_guidelines = """
Flag as Action Required, regardless of how small the diff is:
- Any change that removes or weakens LLM extraction, or automatic hook capture,
  in exchange for lower cost or latency.
- Any path that makes a memory or context failure silent: a swallowed error, a
  default value substituted for missing data, or a log below error level where
  the user loses data.
- Any new behavior that depends on the agent voluntarily calling `save_memory`
  rather than on automatic capture.
- Version drift between Cargo.toml, npm package manifests, and the plugin
  version-sync files when one of them changes.

For Rust specifically, flag `unwrap()`, `expect()`, and panicking indexing on
any path reachable from a hook, an MCP tool call, or a CLI command.

Do not raise findings that only restate a clippy or rustfmt diagnostic, and do
not propose opportunistic refactors outside the scope of the diff.
"""

compliance_user_guidelines = """
Check that a change to behavior already governed by a contract under
`docs/specs/` updates that contract in the same PR. Check `docs/specs/README.md`
for the contract's status first: a spec marked implemented, superseded, or
absorbed is not pending work and must not be cited as an unmet requirement.

For SpecRail-routed work, packets live under `specs/GH<issue-number>/`. Do not
require a SpecRail packet for a small bugfix with a clear root cause.
"""

[review_agent_ux]
# Show every finding up front. The default collapses the tail behind "View all",
# which hides findings from an agent reading the comment through the API.
finding_overflow_count = "all"
expand_description = true
expand_code = true

[pr_code_suggestions]
# Lets a plain follow-up question in a suggestion thread reach Qodo.
enable_chat_in_code_suggestions = true

[qodo_describe_agent]
# Only relevant if `/agentic_describe` is added to `pr_commands` above. "comment"
# keeps Qodo out of the PR body that `/pr:create` owns.
publish_mode = "comment"

[config]
# Escape hatch for PRs that should not consume a review: label the PR `skip-qodo`.
ignore_pr_labels = ["skip-qodo"]
ignore_pr_title = "^(chore\\(deps\\)|Bump) "
